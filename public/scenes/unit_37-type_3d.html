<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>37 TYPE 평면 3D</title>
<style>
:root { --bg: #ffffff; --fg: #333; --btn: #222; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; overflow: hidden; }
canvas { display: block; }
#ui { position: fixed; right: 16px; bottom: 16px; display: flex; gap: 8px; }
#ui button { background: var(--btn); color: #fff; border: 0; border-radius: 6px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
#note { position: fixed; right: 16px; bottom: 56px; font-size: 11px; color: #888; }
body.capture #ui, body.capture #note { display: none; }
</style>
</head>
<body>
<div id="note">※ 상기 이미지는 소비자의 이해를 돕기 위해 제작된 것으로 실제와 다를 수 있습니다.</div>
<div id="ui">
  <button id="labels">라벨 켜기</button>
  <button id="save">PNG 저장</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
window.PLAN = { name: 'unit_37-type_3d', pxPerM: 66, cx: 201, cy: 225, wallH: 1.05, labelScale: 0.0045, labelY: 1.6, cam: { pos: [-0.5, 18, 14.3], target: [0.1, 0, 0.4], fov: 21 }, shadow: 8 };
</script>
<script>
// 평면도 → 아이소메트릭 3D 공통 도구.
// 페이지에서 먼저 window.PLAN = { pxPerM, cx, cy, cam: { pos, target, fov }, shadow } 을 정의하고 이 파일을 불러온다.
// 좌표는 모두 원본 도면 이미지의 픽셀 좌표 (px, py) 로 받는다.
const { pxPerM: PX_PER_M, cx: CX, cy: CY } = PLAN;
const P = (x, y) => [(x - CX) / PX_PER_M, (y - CY) / PX_PER_M];

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.NoToneMapping;
renderer.toneMappingExposure = 0.92;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffffff);

const camera = new THREE.PerspectiveCamera(PLAN.cam.fov || 30, innerWidth / innerHeight, 1, 500);
camera.position.set(...PLAN.cam.pos);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(...PLAN.cam.target);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.45;
controls.update();

scene.add(new THREE.HemisphereLight(0xffffff, 0xb9b4aa, 0.5));
const sun = new THREE.DirectionalLight(0xfffaf0, 0.85);
sun.position.set(-18, 40, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -PLAN.shadow, right: PLAN.shadow, top: PLAN.shadow, bottom: -PLAN.shadow, near: 1, far: 160 });
sun.shadow.bias = -0.0004;
sun.shadow.radius = 3;
scene.add(sun);

// ---------- 재질 ----------
function canvasTex(size, draw, repeatM) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(1 / repeatM, 1 / repeatM);
  t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);
const woodTex = canvasTex(512, (g, s) => {
  const rows = 8;
  for (let r = 0; r < rows; r++) {
    let x = -rand(0, 200);
    while (x < s) {
      const w = rand(150, 300), l = rand(196, 214);
      g.fillStyle = `rgb(${l},${l - 26},${l - 58})`;
      g.fillRect(x, r * s / rows, w, s / rows);
      for (let i = 0; i < 6; i++) { g.fillStyle = `rgba(120,80,40,${rand(0.02, 0.06)})`; g.fillRect(x, r * s / rows + rand(0, s / rows), w, 1); }
      g.fillStyle = 'rgba(90,60,30,0.35)'; g.fillRect(x, r * s / rows, 1.5, s / rows);
      x += w;
    }
    g.fillStyle = 'rgba(90,60,30,0.3)'; g.fillRect(0, r * s / rows, s, 1.5);
  }
}, 2.4);
const tileTex = (base, line, m) => canvasTex(256, (g, s) => {
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(0,0,0,${rand(0, 0.025)})`; g.fillRect(rand(0, s), rand(0, s), rand(2, 10), rand(2, 10)); }
  g.strokeStyle = line; g.lineWidth = 2; g.strokeRect(0, 0, s, s);
}, m);
const speckle = (base, dots, m) => canvasTex(256, (g, s) => {
  g.fillStyle = base; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 1800; i++) { g.fillStyle = dots[i % dots.length]; g.fillRect(rand(0, s), rand(0, s), 1.5, 1.5); }
}, m);
const turfTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#6aa53d'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 5000; i++) { g.fillStyle = `rgba(${rand(40, 120)},${rand(120, 180)},${rand(30, 60)},0.5)`; g.fillRect(rand(0, s), rand(0, s), 1, rand(2, 4)); }
}, 1.5);

const M = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.75, metalness: 0 }, o));
const mat = {
  slab: M({ color: 0xe9e9e7 }),
  wood: M({ map: woodTex, roughness: 0.6 }),
  tileLight: M({ map: tileTex('#d9d9d6', '#bdbdb9', 0.9), roughness: 0.5 }),
  tileStore: M({ map: tileTex('#e2ddd4', '#c4bdb1', 1.2), roughness: 0.45 }),
  tileGray: M({ map: tileTex('#9b9d9f', '#86888a', 0.45), roughness: 0.6 }),
  rubber: M({ map: speckle('#3c3d40', ['#55575c', '#2d2e30', '#6a6c70'], 2) }),
  turf: M({ map: turfTex, roughness: 0.95 }),
  concrete: M({ color: 0xa9a9a7 }),
  shaft: M({ color: 0x4a4b4d }),
  extWall: M({ color: 0x161616, roughness: 0.6 }),
  intWall: M({ color: 0xefede8 }),
  cap: M({ color: 0x575757 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0xc8dce6, transparent: true, opacity: 0.28, roughness: 0.05, metalness: 0.1, depthWrite: false }),
  frame: M({ color: 0x3a3a3a, roughness: 0.4, metalness: 0.5 }),
  white: M({ color: 0xf4f4f2, roughness: 0.4 }),
  black: M({ color: 0x1e1e1e, roughness: 0.5 }),
  metal: M({ color: 0x9a9da0, roughness: 0.3, metalness: 0.7 }),
  darkMetal: M({ color: 0x404244, roughness: 0.35, metalness: 0.6 }),
  lightWood: M({ color: 0xd9bf98, roughness: 0.6 }),
  darkWood: M({ color: 0x6b4a32, roughness: 0.6 }),
  fabricGreen: M({ color: 0x8fa58b, roughness: 0.95 }),
  fabricBeige: M({ color: 0xd7cbb7, roughness: 0.95 }),
  fabricBrown: M({ color: 0x8a5a44, roughness: 0.95 }),
  rug: M({ color: 0xcfc6b8, roughness: 1 }),
  leaf: M({ color: 0x3c7a2c, roughness: 0.9 }),
  pot: M({ color: 0xe8e2d8, roughness: 0.8 }),
  stone: M({ color: 0xc9c5bd, roughness: 0.5 }),
  porcelain: M({ color: 0xffffff, roughness: 0.2 }),
  mirror: M({ color: 0xaab8c0, roughness: 0.05, metalness: 0.9 }),
  elevDoor: M({ color: 0xb5b8bb, roughness: 0.25, metalness: 0.8 }),
  partition: M({ color: 0xd9d2c6, roughness: 0.6 }),
};

// ---------- 기본 도형 ----------
function box(w, h, d, m, x = 0, y = 0, z = 0, parent) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = mesh.receiveShadow = true;
  (parent || scene).add(mesh);
  return mesh;
}
function cyl(r, h, m, x = 0, y = 0, z = 0, parent, seg = 20, r2) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r2 ?? r, r, h, seg), m);
  mesh.position.set(x, y + h / 2, z);
  mesh.castShadow = mesh.receiveShadow = true;
  (parent || scene).add(mesh);
  return mesh;
}
function shapeOf(pts) {
  const s = new THREE.Shape();
  pts.forEach(([x, y], i) => { const [X, Z] = P(x, y); i ? s.lineTo(X, -Z) : s.moveTo(X, -Z); });
  return s;
}
function floor(pts, m, y = 0.002) {
  const mesh = new THREE.Mesh(new THREE.ShapeGeometry(shapeOf(pts)), m);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = y;
  mesh.receiveShadow = true;
  scene.add(mesh);
}
// 도면 좌표 (px, py) 에 놓고, 도면 기준 각도(도)로 돌린 그룹을 돌려준다.
function at(px, py, deg = 0) {
  const g = new THREE.Group();
  const [X, Z] = P(px, py);
  g.position.set(X, 0, Z);
  g.rotation.y = -deg * Math.PI / 180;
  scene.add(g);
  return g;
}
const angleOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI;
// 선분 a→b 위 비율 t 지점에서 안쪽으로 off(px) 만큼 들어간 점
function along(a, b, t, off = 0) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  return [a[0] + dx * t - dy / L * off, a[1] + dy * t + dx / L * off];
}

// ---------- 벽 ----------
const WALL_H = PLAN.wallH || 1.5;
function wallPiece(A, B, t, h, m, capM, y0 = 0) {
  const dx = B[0] - A[0], dz = B[1] - A[1], L = Math.hypot(dx, dz);
  if (L < 0.05) return;
  const g = new THREE.Group();
  g.position.set((A[0] + B[0]) / 2, y0, (A[1] + B[1]) / 2);
  g.rotation.y = -Math.atan2(dz, dx);
  scene.add(g);
  box(L + t, h, t, m, 0, 0, 0, g);
  if (capM) box(L + t + 0.002, 0.03, t + 0.002, capM, 0, h, 0, g);
}
// doors: 시작점에서의 거리(m) [from, to]
function wall(pts, { t = 0.18, h = WALL_H, m = mat.intWall, cap = mat.cap, doors = [] } = {}) {
  for (let i = 0; i < pts.length - 1; i++) {
    const A = P(...pts[i]), B = P(...pts[i + 1]);
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const ds = (Array.isArray(doors[0]) && (doors[0].length === 0 || Array.isArray(doors[0][0])) ? doors[i] : (i === 0 ? doors : [])) || [];
    let s = 0;
    const lerp = (u) => [A[0] + (B[0] - A[0]) * u / L, A[1] + (B[1] - A[1]) * u / L];
    for (const [d0, d1] of [...ds].sort((a, b) => a[0] - b[0])) {
      wallPiece(lerp(s), lerp(d0), t, h, m, cap);
      s = d1;
    }
    wallPiece(lerp(s), B, t, h, m, cap);
  }
}
// 유리 커튼월: 하부 프레임 + 유리 + 멀리언
function glassWall(pts, { h = WALL_H, step = 1.5, doors = [] } = {}) {
  for (let i = 0; i < pts.length - 1; i++) {
    const A = P(...pts[i]), B = P(...pts[i + 1]);
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    const lerp = (u) => [A[0] + (B[0] - A[0]) * u / L, A[1] + (B[1] - A[1]) * u / L];
    const ds = (Array.isArray(doors[0]) && (doors[0].length === 0 || Array.isArray(doors[0][0])) ? doors[i] : (i === 0 ? doors : [])) || [];
    let s = 0;
    const segs = [];
    for (const [d0, d1] of ds) { segs.push([s, d0]); s = d1; }
    segs.push([s, L]);
    for (const [u0, u1] of segs) {
      if (u1 - u0 < 0.05) continue;
      const a = lerp(u0), b = lerp(u1);
      wallPiece(a, b, 0.12, 0.12, mat.frame, null);
      wallPiece(a, b, 0.04, h - 0.12, mat.glass, null, 0.12);
      wallPiece(a, b, 0.1, 0.06, mat.frame, null, h - 0.06);
      const n = Math.max(1, Math.round((u1 - u0) / step));
      for (let k = 0; k <= n; k++) {
        const p = lerp(u0 + (u1 - u0) * k / n);
        box(0.09, h, 0.12, mat.frame, p[0], 0, p[1]).rotation.y = -Math.atan2(B[1] - A[1], B[0] - A[0]);
      }
    }
  }
}

// ---------- 가구 ----------
function treadmill(g) {
  box(0.8, 0.2, 1.9, mat.black, 0, 0, 0, g);
  box(0.55, 0.02, 1.5, M({ color: 0x2b2b2b }), 0, 0.2, 0.1, g);
  [-0.37, 0.37].forEach(x => box(0.05, 1.1, 0.05, mat.darkMetal, x, 0.2, -0.75, g));
  box(0.8, 0.35, 0.12, mat.black, 0, 1.15, -0.8, g).rotation.x = -0.4;
}
function bike(g) {
  box(0.5, 0.25, 1.1, mat.black, 0, 0, 0, g);
  box(0.08, 0.7, 0.08, mat.darkMetal, 0, 0.25, 0.25, g);
  box(0.28, 0.08, 0.35, mat.black, 0, 0.95, 0.25, g);
  box(0.08, 0.8, 0.08, mat.darkMetal, 0, 0.25, -0.35, g);
  box(0.5, 0.25, 0.1, mat.black, 0, 1.0, -0.4, g);
}
function machine(g) {
  box(1.2, 0.08, 1.6, mat.darkMetal, 0, 0, 0, g);
  [[-0.5, -0.7], [0.5, -0.7]].forEach(([x, z]) => box(0.1, 2.0, 0.1, mat.darkMetal, x, 0, z, g));
  box(1.1, 0.1, 0.1, mat.darkMetal, 0, 1.95, -0.7, g);
  box(0.35, 1.1, 0.2, mat.metal, 0, 0.2, -0.7, g);
  box(0.5, 0.1, 0.9, mat.black, 0, 0.45, 0.2, g);
  box(0.5, 0.6, 0.1, mat.black, 0, 0.55, 0.65, g);
}
function rack(g, len = 2) {
  box(len, 0.6, 0.5, mat.darkMetal, 0, 0, 0, g);
  for (let x = -len / 2 + 0.15; x < len / 2; x += 0.22) cyl(0.07, 0.12, mat.black, x, 0.6, 0, g, 10).rotation.z = Math.PI / 2;
}
function bench(g, m = mat.black, len = 1.2) {
  box(0.35, 0.42, len, m, 0, 0, 0, g);
}
function washer(g) {
  box(0.65, 0.85, 0.65, mat.white, 0, 0, 0, g);
  box(0.65, 0.85, 0.65, mat.white, 0, 0.87, 0, g);
  [0.42, 1.29].forEach(y => { const d = cyl(0.21, 0.03, M({ color: 0x5f6a72, roughness: 0.2, metalness: 0.4 }), 0, y - 0.015, 0.335, g, 24); d.rotation.x = Math.PI / 2; });
}
function sofa(g, w = 2, m = mat.fabricGreen) {
  box(w, 0.42, 0.85, m, 0, 0, 0, g);
  box(w, 0.4, 0.2, m, 0, 0.42, -0.33, g);
  [-w / 2 + 0.1, w / 2 - 0.1].forEach(x => box(0.2, 0.2, 0.85, m, x, 0.42, 0, g));
}
function chair(g, m = mat.fabricBeige) {
  box(0.45, 0.45, 0.45, m, 0, 0, 0, g);
  box(0.45, 0.4, 0.08, m, 0, 0.45, -0.19, g);
}
function table(g, w, d, m = mat.lightWood, h = 0.74) {
  box(w, 0.05, d, m, 0, h - 0.05, 0, g);
  [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(0.05, h - 0.05, 0.05, mat.darkMetal, sx * (w / 2 - 0.08), 0, sz * (d / 2 - 0.08), g));
}
function roundTable(g, r = 0.4) {
  cyl(r, 0.04, mat.white, 0, 0.7, 0, g, 28);
  cyl(0.04, 0.7, mat.darkMetal, 0, 0, 0, g, 10);
}
function plant(g, s = 1) {
  cyl(0.22 * s, 0.45 * s, mat.pot, 0, 0, 0, g, 16, 0.26 * s);
  const leaf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.45 * s, 1), mat.leaf);
  leaf.position.y = 0.95 * s; leaf.castShadow = true; g.add(leaf);
}
function toilet(g) {
  box(0.38, 0.4, 0.55, mat.porcelain, 0, 0, 0.05, g);
  box(0.4, 0.4, 0.18, mat.porcelain, 0, 0.3, -0.25, g);
}
function sink(g, n = 1) {
  box(0.6 * n, 0.85, 0.5, mat.stone, 0, 0, 0, g);
  box(0.6 * n, 0.8, 0.02, mat.mirror, 0, 1.0, -0.24, g);
}
function counter(g, len) {
  box(len, 0.9, 0.6, mat.white, 0, 0, 0, g);
  box(len, 0.03, 0.62, mat.stone, 0, 0.9, 0, g);
  box(len, 0.6, 0.35, mat.white, 0, 1.5, -0.12, g);
}
function stairFlight(g, w, run, n, rise = 0.18) {
  for (let i = 0; i < n; i++) box(w, rise * (i + 1), run, mat.stone, 0, 0, i * run, g);
}
function rug(g, w, d, m = mat.rug) { box(w, 0.015, d, m, 0, 0.003, 0, g).castShadow = false; }

// ---------- 장면 조립 도우미 ----------
function slab(footprint, depth = 0.7) {
  const geo = new THREE.ExtrudeGeometry(shapeOf(footprint), { depth, bevelEnabled: false });
  const m = new THREE.Mesh(geo, mat.slab);
  m.rotation.x = -Math.PI / 2;
  m.position.y = -depth;
  m.receiveShadow = true;
  scene.add(m);
}
function rooms(list) { list.forEach((r, i) => floor(r[0], r[1], 0.002 + i * 0.003)); }
function column(px, py, w = 0.9, d = 0.9, deg = 0, h = WALL_H + 0.1) {
  const g = at(px, py, deg);
  box(w, h, d, mat.extWall, 0, 0, 0, g);
  box(w + 0.02, 0.03, d + 0.02, mat.black, 0, h, 0, g);
}
function elevator(px, py, deg = 0, w = 2.0) {
  const g = at(px, py, deg);
  box(w, 0.02, w, mat.shaft, 0, 0.003, -w / 2, g).castShadow = false;
  box(1.1, WALL_H - 0.05, 0.06, mat.elevDoor, 0, 0, 0.0, g);
}
// 꺾인 계단 (두 줄 나란히, deg 방향으로 올라감)
function stairs(px, py, deg = 0, w = 1.2, n1 = 9, n2 = 6) {
  const g = at(px, py, deg);
  [[-w / 2 - 0.05, n1], [w / 2 + 0.05, n2]].forEach(([x, n]) => { const f = new THREE.Group(); f.position.x = x; g.add(f); stairFlight(f, w, 0.28, n); });
}
function armchair(g, m = mat.fabricBeige) {
  box(0.75, 0.4, 0.75, m, 0, 0, 0, g);
  box(0.75, 0.35, 0.15, m, 0, 0.4, -0.3, g);
  [-0.31, 0.31].forEach(x => box(0.13, 0.18, 0.75, m, x, 0.4, 0, g));
}
const child = (g, x, z, deg = 0) => { const c = new THREE.Group(); c.position.set(x, 0, z); c.rotation.y = -deg * Math.PI / 180; g.add(c); return c; };

// ---------- 세대 가구 ----------
function studio(g, w, d, mirror) {
  const sx = mirror ? -1 : 1, X = (x) => mirror ? w - x : x;
  // 욕실
  const bw = Math.min(1.7, w * 0.5), bd = 2.1;
  const bath = child(g, X(bw / 2), 0, 0);
  floorPatch(g, X(bw / 2), bd / 2, bw, bd, mat.tileGray);
  wallLocal(g, [X(bw), 0], [X(bw), bd]);
  wallLocal(g, [X(0), bd], [X(bw * 0.25), bd]);
  toilet(child(bath, -sx * 0.35, 0.45, 0));
  box(0.5, 0.85, 0.4, mat.stone, sx * 0.3, 0, bd - 0.45, bath);
  // 주방
  const k = child(g, X(w - 0.3), 1.3, mirror ? 90 : 270);
  box(1.8, 0.88, 0.6, mat.white, 0, 0, 0, k);
  box(1.8, 0.03, 0.62, mat.stone, 0, 0.88, 0, k);
  box(0.6, 0.85, 0.6, M({ color: 0xdcdcdc, roughness: 0.3 }), 0, 0, -1.3, k);
  // 붙박이장
  box(0.6, 1.9, 1.4, mat.lightWood, X(w - 0.32), 0, 3.0, g);
  // 침대 · 책상
  const bed = child(g, X(0.62), d - 1.15, 0);
  box(1.1, 0.35, 2.0, mat.lightWood, 0, 0, 0, bed);
  box(1.0, 0.18, 1.9, mat.white, 0, 0.35, 0.02, bed);
  box(0.9, 0.12, 0.35, mat.white, 0, 0.53, -0.75, bed);
  box(1.0, 0.04, 1.2, mat.fabricGreen, 0, 0.54, 0.35, bed);
  const desk = child(g, X(w - 0.38), d - 1.0, mirror ? 90 : 270);
  table(desk, 1.2, 0.55, mat.lightWood);
  chair(child(desk, 0, 0.55, 180), mat.fabricBeige);
}
function floorPatch(g, x, z, w, d, m) { box(w, 0.012, d, m, x, 0.002, z, g).castShadow = false; }
function wallLocal(g, a, b, t = 0.12, h = WALL_H) {
  const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz);
  const p = child(g, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2, Math.atan2(dz, dx) * 180 / Math.PI);
  box(L + t, h, t, mat.intWall, 0, 0, 0, p);
  box(L + t, 0.03, t, mat.cap, 0, h, 0, p);
}

// ---------- 라벨 ----------
const labelSprites = [];
function label(text, px, py, color = '#6f8a12') {
  const c = document.createElement('canvas');
  const g = c.getContext('2d');
  const fs = 44;
  g.font = `600 ${fs}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
  const w = g.measureText(text).width + 56;
  c.width = w; c.height = fs + 36;
  g.font = `600 ${fs}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
  g.fillStyle = color;
  g.beginPath(); g.roundRect ? g.roundRect(0, 0, w, c.height, c.height / 2) : g.rect(0, 0, w, c.height); g.fill();
  g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.textAlign = 'center';
  g.fillText(text, w / 2, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false }));
  const k = PLAN.labelScale || 0.015;
  s.scale.set(w * k, c.height * k, 1);
  const [X, Z] = P(px, py);
  s.position.set(X, PLAN.labelY || 2.4, Z);
  s.renderOrder = 10;
  s.visible = false;
  scene.add(s);
  s.userData.text = text;
  labelSprites.push(s);
}

// ---------- 렌더 ----------
// 장면 코드를 다 만든 뒤 마지막에 호출한다.
function start() {
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  (function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

  const labelBtn = document.getElementById('labels');
  labelBtn.onclick = () => {
    const on = !labelSprites[0].visible;
    labelSprites.forEach(s => s.visible = on);
    labelBtn.textContent = on ? '라벨 끄기' : '라벨 켜기';
  };
  if (location.hash.includes('labels')) labelBtn.onclick();
  if (location.hash.includes('capture')) document.body.classList.add('capture');
  document.getElementById('save').onclick = () => {
    renderer.render(scene, camera);
    const a = document.createElement('a');
    a.href = renderer.domElement.toDataURL('image/png');
    a.download = PLAN.name + '.png';
    a.click();
  };
}
</script>
<script>
// 세대 평면도 공통 도구. 좌표는 각 평면도 이미지의 픽셀 좌표.
sun.shadow.mapSize.set(2048, 2048);
sun.position.set(-5, 12, 4);
const lerp2 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const extW = { t: 0.22, h: WALL_H + 0.05, m: mat.extWall, cap: mat.black };
const intW = { t: 0.13 };
const XZ = (px, py, y = 0) => { const [X, Z] = P(px, py); return [X, y, Z]; };
// 외벽에 창 내기: wins 는 픽셀 구간 [[p0, p1], ...] (a 에서부터 잰 x 또는 y 값)
function facade(a, b, wins, axis = 'x') {
  const L = Math.hypot(b[0] - a[0], b[1] - a[1]);
  const i = axis === 'x' ? 0 : 1;
  const fr = wins.map(([p0, p1]) => [Math.abs(p0 - a[i]) / Math.abs(b[i] - a[i]), Math.abs(p1 - a[i]) / Math.abs(b[i] - a[i])].sort((u, v) => u - v));
  wall([a, b], { ...extW, doors: fr.map(([f0, f1]) => [f0 * L / PX_PER_M, f1 * L / PX_PER_M]) });
  fr.forEach(([f0, f1]) => glassWall([lerp2(a, b, f0), lerp2(a, b, f1)], { h: WALL_H + 0.05, step: 9 }));
}
// 픽셀 사각형 [x0,y0,x1,y1] 을 높이 h 상자로
function block(r, h, m, y = 0) {
  const [x0, y0, x1, y1] = r;
  const w = (x1 - x0) / PX_PER_M, d = (y1 - y0) / PX_PER_M;
  return box(w, h, d, m, ...XZ((x0 + x1) / 2, (y0 + y1) / 2, y));
}
const tileRect = (r, m = mat.tileGray) => floor([[r[0], r[1]], [r[2], r[1]], [r[2], r[3]], [r[0], r[3]]], m, 0.02);
function bed(px, py, deg, w = 1.5, m = mat.fabricBeige, len = 2.0) {
  const g = at(px, py, deg);
  box(w, 0.35, len, mat.lightWood, 0, 0, 0, g);
  box(w - 0.1, 0.18, len - 0.1, mat.white, 0, 0.35, 0.02, g);
  box(w + 0.1, 0.75, 0.08, mat.lightWood, 0, 0, -len / 2 - 0.04, g);
  (w > 1.2 ? [-w / 4, w / 4] : [0]).forEach(x => box(w > 1.2 ? w / 2 - 0.15 : w - 0.2, 0.12, 0.33, mat.white, x, 0.53, -len / 2 + 0.3, g));
  box(w - 0.05, 0.05, len * 0.6, m, 0, 0.54, len * 0.18, g);
  return g;
}
function tub(r) {
  block(r, 0.55, mat.porcelain);
  const [x0, y0, x1, y1] = r, i = 0.08 * PX_PER_M;
  block([x0 + i, y0 + i, x1 - i, y1 - i], 0.02, M({ color: 0xcfe0e6, roughness: 0.1 }), 0.5);
}
// 직선 주방 카운터: r 은 카운터 사각형, cook/sink 는 픽셀 좌표
function counter(r, { cook, sink } = {}) {
  block(r, 0.88, mat.white);
  block(r, 0.03, mat.stone, 0.88);
  const horiz = (r[2] - r[0]) > (r[3] - r[1]);
  if (cook) box(horiz ? 0.6 : 0.5, 0.02, horiz ? 0.5 : 0.6, mat.black, ...XZ(...cook, 0.905));
  if (sink) box(horiz ? 0.6 : 0.42, 0.02, horiz ? 0.42 : 0.6, mat.metal, ...XZ(...sink, 0.9));
}
const tall = (r, m = mat.white, h = 1.0) => block(r, h, m);
const duct = (r) => block(r, WALL_H + 0.05, mat.extWall);
function sinkAt(px, py, deg) { const g = at(px, py, deg); box(0.55, 0.82, 0.42, mat.stone, 0, 0, 0, g); box(0.4, 0.05, 0.3, mat.porcelain, 0, 0.82, 0, g); return g; }
function lounge(px, py, deg, w = 2.0) {
  const g = at(px, py, deg);
  sofa(child(g, 0, 0, 0), w, mat.fabricGreen);
  box(0.9, 0.36, 0.5, mat.lightWood, 0, 0, 1.0, g);
  rug(child(g, 0, 0.9, 0), w + 0.4, 1.9);
  return g;
}
function dining(px, py, deg, n = 2) {
  const g = at(px, py, deg);
  table(g, n > 2 ? 1.2 : 0.8, 0.75, mat.lightWood);
  const xs = n > 2 ? [-0.32, 0.32] : [0];
  xs.forEach(x => { chair(child(g, x, -0.6, 0)); chair(child(g, x, 0.6, 180)); });
  return g;
}
function deskAt(px, py, deg) { const g = at(px, py, deg); table(g, 1.1, 0.55, mat.lightWood); chair(child(g, 0, 0.55, 180), mat.fabricBeige); return g; }
function washerAt(px, py, deg) { const g = at(px, py, deg); washer(g); return g; }

// unit/37-type.webp (403x454), 전용 37㎡ 기준 약 66px = 1m
const OUT = [[12,10],[300,10],[300,45],[390,45],[390,440],[12,440]];
slab(OUT, 0.3);
rooms([[OUT, mat.wood], [[[207,10],[270,10],[270,100],[207,100]], mat.tileGray]]);
tileRect([12, 10, 192, 103]); tileRect([100, 110, 145, 192]);
wall([[12,10],[300,10]], { ...extW, doors: [[(210 - 12) / PX_PER_M, (265 - 12) / PX_PER_M]] });
wall([[300,10],[300,45],[390,45],[390,440]], extW);
wall([[12,440],[12,10]], extW);
facade([390,440], [12,440], [[70, 160], [242, 330]]);
// 욕실
tub([14, 45, 100, 98]);
tall([14, 12, 92, 38], mat.white, 0.85);
toilet(at(170, 32, 0));
glassWall([[130,12],[130,62]], { h: 1.0, step: 9 });
wall([[12,103],[150,103]], intW);
// 중앙 벽
wall([[200,10],[200,138]], intW);
wall([[200,180],[200,228]], intW);
wall([[200,275],[200,440]], intW);
// 드레스룸 · 파우더
wall([[92,103],[92,195]], intW);
wall([[12,192],[45,192]], intW);
wall([[95,192],[145,192]], intW);
tall([14, 112, 32, 188], mat.lightWood);
sinkAt(122, 120, 0);
// 현관 수납 · 덕트
tall([270, 12, 292, 100]);
duct([292, 10, 302, 108]);
// 주방
counter([345, 47, 388, 205], { cook: [366, 64], sink: [366, 150] });
tall([345, 205, 388, 280], M({ color: 0xdcdcdc, roughness: 0.3 }));
dining(275, 190, 90, 4);
// 거실
lounge(340, 360, 90, 2.0);
block([207, 330, 222, 400], 0.45, mat.darkWood);
box(0.05, 0.6, 0.9, mat.black, ...XZ(209, 365, 0.55));
// 침실
wall([[160,352],[200,352]], intW);
wall([[160,352],[160,440]], intW);
tall([166, 360, 195, 438], mat.lightWood);
bed(85, 300, -90, 1.5, mat.fabricBeige);
label('욕실', 60, 60); label('주방', 330, 120); label('거실', 300, 330); label('침실', 90, 330); label('드레스룸', 52, 150);

start();
</script>
<script>
// 화면이 좁으면 카메라를 뒤로 빼서 건물이 잘리지 않게 한다 (가로:세로 1.1 보다 좁을 때)
(function () {
  const base = camera.position.clone().sub(controls.target);
  function fit() { const k = Math.max(1, 1.1 / (innerWidth / innerHeight)); camera.position.copy(controls.target).add(base.clone().multiplyScalar(k)); }
  fit();
  addEventListener('resize', fit);
})();
</script>
<script>
// 다시고침 앱 안에 iframe 으로 들어갈 때 쓰는 연동 스크립트.
//   ?embed=1            자체 버튼·안내 문구를 숨기고 공간 이름 라벨을 켠다.
//   ?embed=1&mode=pick  화면을 탭하면 그 지점에 핀을 꽂고 부모 창에 좌표를 보낸다.
// 부모 → 장면: { source: 'dasigochim-app', type: 'setPin', pin: {x,y,z} } / { type: 'clearPin' }
// 장면 → 부모: { source: 'dasigochim-scene', type: 'ready' } / { type: 'pin', pin: {x,y,z,label} }
(function () {
  const params = new URLSearchParams(location.search);
  if (!params.has('embed')) return;
  document.body.classList.add('capture');
  labelSprites.forEach((s) => { s.visible = true; });

  const red = new THREE.MeshStandardMaterial({ color: 0xe5484d, roughness: 0.35 });
  const pin = new THREE.Group();
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), red);
  head.position.y = 1.1;
  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 1.0, 8), new THREE.MeshStandardMaterial({ color: 0x8a1c1f }));
  stem.position.y = 0.5;
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.42, 28),
    new THREE.MeshBasicMaterial({ color: 0xe5484d, transparent: true, opacity: 0.55, side: THREE.DoubleSide, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  [head, stem].forEach((m) => { m.castShadow = true; });
  pin.add(head, stem, ring);
  pin.visible = false;
  // 장면 크기에 맞춰 핀 크기를 정한다 (세대 평면 ≈ 0.4배, 층 전체 ≈ 1배).
  pin.scale.setScalar(Math.max(0.35, camera.position.distanceTo(controls.target) / 55));
  scene.add(pin);

  const isPinPart = (o) => { for (let p = o; p; p = p.parent) if (p === pin) return true; return false; };
  const nearestLabel = (p) => {
    let best = null, bestDist = Infinity;
    labelSprites.forEach((s) => {
      const d = Math.hypot(s.position.x - p.x, s.position.z - p.z);
      if (d < bestDist) { bestDist = d; best = s.userData.text || null; }
    });
    return best;
  };
  const placePin = (p) => { pin.position.set(p.x, p.y, p.z); pin.visible = true; };
  const post = (msg) => parent.postMessage(Object.assign({ source: 'dasigochim-scene' }, msg), '*');

  addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.source !== 'dasigochim-app') return;
    if (d.type === 'setPin' && d.pin) placePin(d.pin);
    if (d.type === 'clearPin') pin.visible = false;
  });

  if (params.get('mode') === 'pick') {
    const ray = new THREE.Raycaster();
    const ndc = new THREE.Vector2();
    let down = null;
    renderer.domElement.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY }; });
    renderer.domElement.addEventListener('pointerup', (e) => {
      // 끌어서 돌린 건 탭이 아니다.
      const moved = !down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6;
      down = null;
      if (moved) return;
      const r = renderer.domElement.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      ray.setFromCamera(ndc, camera);
      const hit = ray.intersectObjects(scene.children, true).find((h) =>
        h.object.isMesh && !isPinPart(h.object) && !(h.object.material && h.object.material.transparent));
      if (!hit) return;
      const p = hit.point;
      placePin(p);
      post({ type: 'pin', pin: { x: +p.x.toFixed(3), y: +p.y.toFixed(3), z: +p.z.toFixed(3), label: nearestLabel(p) } });
    });
  }
  post({ type: 'ready' });
})();
</script>
